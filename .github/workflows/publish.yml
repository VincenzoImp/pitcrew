name: Publish

# A pushed version tag stages the package on npm with trusted publishing (no npm token) and creates
# the GitHub release. A maintainer approves the staged version on npmjs.com (2FA). See CONTRIBUTING.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/main, for the check below
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later, `npm stage publish` 11.15.0 or later.
      - run: npm install -g "npm@>=11.15.0 <12" && npm --version
      - name: The tag matches package.json and is on main
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v head="## [${GITHUB_REF_NAME#v}]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section ## [${GITHUB_REF_NAME#v}]"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm stage publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "pitcrew ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
